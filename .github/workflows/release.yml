name: Release AAB

# Builds the signed Play Store bundle on demand: Actions tab → "Release AAB" → Run workflow.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  release.keystore, base64-encoded
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown on Play (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the RELEASE_KEYSTORE_BASE64 secret first"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
      - name: Build signed bundle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then echo "::error::Add the RELEASE_STORE_PASSWORD secret first"; exit 1; fi
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace --console=plain
      - name: Remove keystore
        if: always()
        run: rm -f release.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: rave-${{ inputs.version_name }}-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
