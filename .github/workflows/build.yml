name: Build

on:
  push:
    branches: [ "claude/**", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleStaging --stacktrace --console=plain
      - name: Unit tests + screenshots
        run: ./gradlew :app:testDebugUnitTest --console=plain --continue
      - name: Commit screenshots to docs/screenshots
        if: github.event_name == 'push'
        run: |
          mkdir -p docs/screenshots
          cp app/build/screenshots/*.png docs/screenshots/ 2>/dev/null || exit 0
          git config user.name "rave-ci"
          git config user.email "rave-ci@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || (git commit -m "Update app screenshots [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
